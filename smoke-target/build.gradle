plugins {
    id "com.android.application"
}

android {
    namespace "com.dankhole.airlock.smoketarget"
    compileSdk 36

    defaultConfig {
        applicationId "com.dankhole.airlock.smoketarget"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    beforeVariants(selector().withBuildType("release")) { variantBuilder ->
        variantBuilder.enable = false
    }
}
